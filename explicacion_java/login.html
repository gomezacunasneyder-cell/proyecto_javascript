<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbit PC Store - Inicio de Sesión</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/login.js" defer></script>
</head>
<body>

  <section id="seccion-login" class="contenedor-formulario">
    <div class="tarjeta-formulario">
      <h2>Iniciar Sesión</h2>
      <p class="subtitulo">Ingresa a Orbit PC Store para gestionar tus compras</p>

      <form id="formularioLogin">
        <div class="grupo-input">
          <label for="username">Número de Identificación</label>
          <input type="text" id="username" name="username" placeholder="Ej. 1002345678" required>
        </div>

        <div class="grupo-input">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required>
        </div>

        <button type="submit" id="btn-login">Ingresar</button>
      </form>

      <p class="mensaje-error" id="mensajeError"></p>

      <p class="subtitulo">
        ¿No tienes cuenta? <a href="index.html">Regístrate aquí</a>
      </p>
    </div>
  </section>

</body>
</html>>>
