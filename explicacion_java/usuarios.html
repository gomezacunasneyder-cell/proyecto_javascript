<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbit PC Store - Módulo de Usuarios</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/session.js" defer></script>
  <script src="js/usuarios.js" defer></script>
</head>

<body>

  <!-- MENÚ DE NAVEGACIÓN SUPERIOR -->
  <header class="barra-navegacion">
    <div class="logo">
      <h1>Orbit PC <span>Store</span></h1>
    </div>
    <nav>
      <ul class="enlaces-nav">
        <li><a href="usuarios.html" class="activo">Usuarios</a></li>
        <li><a href="inventario.html">Inventario</a></li>
        <li><a href="produccion.html">Producción</a></li>
      </ul>
    </nav>
    <div class="barra-sesion">
      <span id="usuarioActivo"></span>
      <button id="btnlogout">Cerrar sesión</button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="contenido-principal">
    <section id="seccion-usuarios" class="contenedor-formulario">

      <div class="tarjeta-formulario">
        <div class="encabezado-tabla">
          <h2>Gestión de Usuarios</h2>
          <button id="btnAgregarUsuario">Agregar usuario</button>
        </div>
        <table id="tablaUsuarios">
          <thead>
            <tr>
              <th>Numero de identificacion</th>
              <th>Nombre completo</th>
              <th>Cargo</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cuerpoTablaUsuarios"></tbody>
        </table>
      </div>

    </section>
  </main>

  <!-- MODAL CREAR/EDITAR USUARIO -->
  <div id="modalUsuario" class="modal hidden">
    <div class="modal-contenido">
      <h3 id="tituloFormulario">Crear usuario</h3>

      <form id="formulario-usuario">
        <input type="hidden" id="idOriginal">

        <div class="grupo-input">
          <label for="idNumber">Número de Identificación</label>
          <input type="text" id="idNumber" name="idNumber" placeholder="Ej. 1002345678" required>
        </div>

        <div class="grupo-input">
          <label for="fullName">Nombre Completo</label>
          <input type="text" id="fullName" name="fullName" placeholder="Ej. Stiven Gómez" required>
        </div>

        <div class="grupo-input">
          <label for="position">Cargo</label>
          <input type="text" id="position" name="position" placeholder="Ej. Operario de producción" required>
        </div>

        <div class="grupo-input">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" minlength="6">
        </div>

        <div class="grupo-input">
          <label for="confirmPassword">Confirmar Contraseña</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" minlength="6">
        </div>

        <p class="mensaje-error" id="mensajeError"></p>

        <div class="acciones-modal">
          <button type="submit" id="btn-guardar">Guardar</button>
          <button type="button" id="btncancelar">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

</body>

</html>
