<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acme Producción - Inicio de Sesión</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="data/api.js" defer></script>
  <script src="data/dataManager.js" defer></script>
  <script src="components/acme-button.js" defer></script>
  <script src="components/acme-input.js" defer></script>
  <script src="components/acme-toast.js" defer></script>
  <script src="modules/auth.js" defer></script>
</head>
<body>

  <acme-toast></acme-toast>

  <section id="seccion-login" class="contenedor-formulario">
    <div class="tarjeta-formulario">
      <h2>Iniciar Sesión</h2>
      <p class="subtitulo">Ingresa a Acme Producción para gestionar el sistema</p>

      <form id="formularioLogin">
        <acme-input label="Número de Identificación" type="text" id="username" name="username" placeholder="Ej. 1002345678" required></acme-input>
        <acme-input label="Contraseña" type="password" id="contrasena" name="contrasena" placeholder="••••••••" required></acme-input>

        <acme-button type="submit" variant="primary">Ingresar</acme-button>
      </form>

      <p class="mensaje-error" id="mensajeError"></p>

      <p class="subtitulo">
        ¿No tienes cuenta? <a href="index.html">Regístrate aquí</a>
      </p>
    </div>
  </section>

</body>
</html>
