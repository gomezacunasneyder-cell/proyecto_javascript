<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acme Producción - Registro</title>
  <link rel="stylesheet" href="src/css/styles.css">
  <script src="src/data/api.js" defer></script>
  <script src="src/data/dataManager.js" defer></script>
  <script src="src/components/acme-button.js" defer></script>
  <script src="src/components/acme-input.js" defer></script>
  <script src="src/components/acme-toast.js" defer></script>
  <script src="src/modules/auth.js" defer></script>
</head>
<body>

  <acme-toast></acme-toast>

  <section class="contenedor-formulario">
    <div class="tarjeta-formulario">
      <h2>Registro de Usuario</h2>
      <p class="subtitulo">Crea una cuenta nueva para acceder al sistema</p>

      <form id="formularioRegistro">
        <acme-input label="Número de Identificación" type="text" id="idNumber" required></acme-input>
        <acme-input label="Nombre Completo" type="text" id="fullName" required></acme-input>
        <div class="grupo-input">
          <label for="position">Cargo</label>
          <select id="position" name="position" required>
            <option value="">Seleccione un cargo</option>
            <option value="Jefe">Jefe</option>
            <option value="Usuario">Usuario</option>
          </select>
        </div>
        <acme-input label="Contraseña" type="password" id="password" required minlength="6"></acme-input>
        <acme-input label="Confirmar Contraseña" type="password" id="confirmPassword" required minlength="6"></acme-input>

        <acme-button type="submit" variant="primary">Registrarse</acme-button>
      </form>

      <p class="mensaje-error" id="mensajeError"></p>

      <p class="subtitulo">
        ¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a>
      </p>
    </div>
  </section>

  <script>
    // Evitar que el campo Nombre completo acepte números mientras se escribe
    document.addEventListener('DOMContentLoaded', () => {
      const fullName = document.getElementById('fullName');
      if (!fullName) return;

      fullName.addEventListener('input', () => {
        // `acme-input` expone .value; eliminamos dígitos si el usuario los escribe
        const current = fullName.value || '';
        const cleaned = current.replace(/[0-9]/g, '');
        if (current !== cleaned) fullName.value = cleaned;
      });
    });
  </script>

</body>
</html>
