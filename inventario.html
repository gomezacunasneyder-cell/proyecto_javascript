<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario - Acme</title>
  <link rel="stylesheet" href="src/css/styles.css">
  <script src="src/data/api.js" defer></script>
  <script src="src/data/dataManager.js" defer></script>
  <script src="src/components/acme-navbar.js" defer></script>
  <script src="src/components/acme-button.js" defer></script>
  <script src="src/components/acme-input.js" defer></script>
  <script src="src/components/acme-toast.js" defer></script>
  <script src="src/modules/session.js" defer></script>
  <script src="src/modules/inventory.js" defer></script>
</head>

<body>
  <acme-toast></acme-toast>
  <acme-navbar active-page="inventario"></acme-navbar>

  <main class="contenido-principal">
    <section class="contenedor-formulario">

      <div class="tarjeta-formulario">
        <h2>Registrar Nuevo Producto</h2>
        <form id="formProducto">

          <acme-input label="Código del Producto:" type="text" id="prodCodigo" placeholder="Ej: MP-001 o PR-001"
            required></acme-input>
          <acme-input label="Nombre:" type="text" id="prodNombre" placeholder="Ej: Harina de trigo"
            required></acme-input>

          <div class="grupo-input">
            <label for="prodTipo">Tipo de Producto:</label>
            <select id="prodTipo" required>
              <option value="" disabled selected>Seleccione una opción</option>
              <option value="Materia Prima">Materia Prima</option>
              <option value="Producto Terminado">Producto Terminado (Fabricado)</option>
            </select>
          </div>

          <div class="grupo-input">
            <label for="prodUnidad">Unidad de Medida:</label>
            <select id="prodUnidad" required>
              <option value="" disabled selected>Seleccione una unidad</option>
              <option value="g">Gramos (g)</option>
              <option value="kg">Kilogramos (kg)</option>
              <option value="ml">Mililitros (ml)</option>
              <option value="l">Litros (l)</option>
              <option value="ud">Unidades (ud)</option>
            </select>
          </div>

          <div class="grupo-input" id="contenedorProveedor">
            <label for="prodProveedor">Proveedor:</label>
            <input type="text" id="prodProveedor" placeholder="Ej: Distribuidora Acme">
          </div>

          <div class="grupo-input">
            <label for="prodStock">Stock Inicial / Cantidad:</label>
            <div style="display: flex; gap: 0.5rem;">
              <input type="number" id="prodStock" min="0" step="any" value="0" placeholder="Ej: 50" required>
              <acme-button type="button" id="btnSumarStock" variant="primary">+</acme-button>
              <acme-button type="button" id="btnRestarStock" variant="primary">-</acme-button>
            </div>
          </div>

          <div class="grupo-input" id="seccionFormula" style="display: none;">
            <h3>Fórmula / Receta</h3>
            <div id="listaInsumosFormula" style="margin-bottom: 1rem;"></div>
            <acme-button type="button" id="btnAgregarInsumo" variant="secondary">+ Añadir Insumo a la
              Receta</acme-button>
          </div>

          <div style="margin-top: 1.5rem;">
            <acme-button type="submit" id="btnGuardarProducto" variant="primary">Registrar Producto Nuevo</acme-button>
          </div>
        </form>
      </div>

      <div class="tarjeta-formulario" style="margin-top: 30px;">
        <div class="encabezado-tabla">
          <h2>Lista de Productos e Inventario</h2>
          <div>
            <input type="text" id="buscadorProducto" placeholder="Buscar por código o nombre...">
            <p class="nota" id="inventarioNota">Mostrando los primeros 5 productos. Busca para ver más resultados.</p>
          </div>
        </div>

        <table id="tablaInventario">
          <thead>
            <tr>
              <th>Código</th>
              <th>Nombre</th>
              <th>Proveedor / Tipo</th>
              <th>Stock Actual</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="cuerpoTablaInventario"></tbody>
        </table>
      </div>

    </section>
  </main>
</body>

</html>
