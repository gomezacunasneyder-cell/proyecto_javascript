<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planta Macondo ACME | Gestión de Producción</title>
  <link rel="stylesheet" href="src/css/styles.css">
  <script src="src/data/api.js" defer></script>
  <script src="src/data/dataManager.js" defer></script>
  <script src="src/components/acme-toast.js" defer></script>
  <script src="src/modules/auth.js" defer></script>
</head>
<body>

  <acme-toast></acme-toast>

  <section id="seccion-login" class="contenedor-formulario">
    <div class="tarjeta-formulario login-card">
      <div class="login-brand">
        <img src="src/assets/acme-logo.svg" alt="Logo ACME" class="login-logo">
        <div>
          <h2>Planta Macondo ACME</h2>
          <p class="subtitulo">Gestión de producción y control de inventario</p>
        </div>
      </div>

      <p class="subtitulo">Inicia sesión para administrar tus operaciones</p>

      <form id="formularioLogin">
        <div class="grupo-input">
          <label for="username">Número de Identificación</label>
          <input type="text" id="username" name="username" placeholder="Ej. 1002345678" required>
        </div>

        <div class="grupo-input">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required>
        </div>

        <button type="submit" id="btn-login">Ingresar al sistema</button>
      </form>

      <p class="mensaje-error" id="mensajeError"></p>

      <p class="subtitulo">
        ¿No tienes cuenta? <a href="crearusser.html">Regístrate aquí</a>
      </p>
    </div>
  </section>

</body>
</html>
